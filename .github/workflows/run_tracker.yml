name: Run Workout Tracker Test

on:
  workflow_dispatch: # This ensures it ONLY runs when you click the manual button!

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Script with Cloud Secrets
        env:
          ENV_NIX_APP_ID: ${{ secrets.ENV_NIX_APP_ID }}
          ENV_NIX_API_KEY: ${{ secrets.ENV_NIX_API_KEY }}
          ENV_SHEETY_TOKEN: ${{ secrets.ENV_SHEETY_TOKEN }}
          ENV_SHEETY_ENDPOINT: ${{ secrets.ENV_SHEETY_ENDPOINT }}
        run: python main.py
